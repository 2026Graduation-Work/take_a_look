seed: 42
experiment_name: psychology_ab

features:
  # 기준 모델이 기록한 161개 feature_names를 A/B 공통 입력으로 사용한다.
  baseline_group: base
  # treatment feature store에 materialize된 외부 피처. 컬럼 추가는 이 목록만 바꾼다.
  treatment:
    - synthetic_psychology_index
    - news_sentiment

profiles:
  stable:
    data:
      baseline_price_dir: ../../workspace/experiments/datasets/local_2016_kospi_v1/processed
      treatment_price_dir: ../../workspace/experiments/datasets/local_2016_kospi_v1/feature_store/psychology_news_v1
      tickers: []  # 공식 실험에서는 고정한 6자리 코드 목록을 넣는다.
      train_start: "2022-01-01"
      train_end: "2024-12-31"
      test_start: "2025-01-08"
      test_end: "2025-12-31"
    labels:
      type: dynamic_sigma
      horizon: 20
      up_mult: 3.75
      down_mult: 3.00

  aggressive:
    data:
      baseline_price_dir: ../../workspace/experiments/datasets/local_2016_kospi_v1/processed
      treatment_price_dir: ../../workspace/experiments/datasets/local_2016_kospi_v1/feature_store/psychology_news_v1
      tickers: []
      train_start: "2022-01-01"
      train_end: "2024-12-31"
      test_start: "2025-01-08"
      test_end: "2025-12-31"
    labels:
      type: dynamic_sigma
      horizon: 5
      up_mult: 1.75
      down_mult: 1.50

model:
  # 공식 H5/H20 baseline config와 동일한 LightGBM 설정을 네 런에 공통 적용한다.
  params:
    objective: multiclass
    num_class: 3
    n_estimators: 1000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 20
    min_child_samples: 2000
    colsample_bytree: 0.7
    subsample: 0.8
    subsample_freq: 1
    class_weight: balanced

# runner가 네 prediction별 공용 run_backtest config를 자동 생성할 때 사용한다.
strategy:
  score_column: prob_up
  selection: top_k
  top_n: 5
  prob_threshold: 0.65
  position_weighting: equal_weight

backtest:
  initial_cash: 10000000
  signal_lag_days: 1
  entry_price: open
  exit_price: open
  fee: 0.00105
  up_mult: 1.8
  down_mult: 1.2
  hard_sl_mult: 1.5

evaluation:
  # ML 평가는 기존 chart 의미론대로 class 2(Up) vs rest로 계산한다.
  classification_threshold: 0.5
  calibration_bins: 10
  volatile_fraction: 0.2
  random_baseline_seeds: 5

output_dir: ../results/psychology_ab
