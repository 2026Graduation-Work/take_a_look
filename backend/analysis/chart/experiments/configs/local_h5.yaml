contract_version: 3
dataset: experiments/configs/datasets/dataset_kospi.yaml
experiment_name: local_h5_kospi
description: Local reproducible baseline
data:
  point_in_time: false
  universe: all
  tickers: []
  start_date: '2022-01-01'
  end_date: '2025-12-31'
  split_strategy: single
  embargo_days: 7
  splits:
  - fold_id: 0
    train_start: '2022-01-01'
    train_end: '2024-12-31'
    test_start: '2025-01-08'
    test_end: '2025-12-31'
features:
  groups:
  - base
  include: []
  exclude: []
labels:
  type: dynamic_sigma
  horizon: 5
  up_mult: 1.75
  down_mult: 1.5
model:
  type: LGBM
  objective: multiclass
  params:
    n_estimators: 1000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 20
    min_child_samples: 2000
    class_weight: balanced
    random_state: 42
    n_jobs: -1
training:
  skip_validation: true
strategy:
  score_column: prob_up
  selection: top_k
  top_n: 5
  prob_threshold: 0.65
  position_weighting: equal_weight
backtest:
  initial_cash: 10000000
  signal_lag_days: 1
  entry_price: open
  exit_price: rule
  fee: 0.00105
  max_holding_days: 5
  up_mult: 1.75
  down_mult: 1.5
  hard_sl_mult: 1.2
evaluation:
  probability_bins:
  - 0
  - 0.2
  - 0.4
  - 0.6
  - 0.8
  - 1
  benchmark_file: workspace/experiments/datasets/shared_v3_kospi_2016/benchmarks/KOSPI.parquet
  benchmark_strategies:
  - market_index
