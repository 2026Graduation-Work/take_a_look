contract_version: 3
dataset: experiments/configs/datasets/dataset_kospi_qlib_2022_2025.yaml
experiment_name: qlib_2022_2025_h5
description: 2022..2024 train, 2025 OOS; one sliding fold; official Qlib Alpha158.
tags:
- qlib_alpha158
- four_year
- single_fold
- h5
data:
  embargo_days: 7
  end_date: '2025-12-31'
  point_in_time: false
  sliding:
    end_year: 2025
    start_year: 2022
    test_window_years: 1
    train_window_years: 3
  split_strategy: sliding
  start_date: '2022-01-01'
  tickers: []
  universe: all
features:
  exclude: []
  groups:
  - base
  include: []
labels:
  down_class: 0
  down_mult: 1.5
  horizon: 5
  neutral_class: 1
  type: dynamic_sigma
  up_class: 2
  up_mult: 1.75
  volatility_mode: current_sigma
model:
  objective: multiclass
  params:
    class_weight: balanced
    colsample_bytree: 0.7
    learning_rate: 0.01
    max_depth: 5
    min_child_samples: 2000
    n_estimators: 1000
    n_jobs: -1
    num_leaves: 20
    random_state: 42
    subsample: 0.8
    subsample_freq: 1
  type: LGBM
training:
  skip_validation: true
strategy:
  position_weighting: equal_weight
  prob_threshold: 0.0
  score_column: prob_up
  selection: top_k
  top_n: 5
backtest:
  capital_mode: independent_year
  down_mult: 1.5
  entry_price: open
  exit_price: rule
  fee: 0.00105
  slippage_bps: 10
  max_participation: 0.025
  hard_sl_mult: 1.2
  initial_cash: 100000000
  max_holding_days: 5
  signal_lag_days: 1
  up_mult: 1.75
evaluation:
  benchmark_file: workspace/experiments/datasets/qlib_kospi_2022_2025/benchmarks/KOSPI.parquet
  random_baseline_runs: 30
  benchmark_strategies:
  - market_index
  probability_bins:
  - 0
  - 0.2
  - 0.4
  - 0.6
  - 0.8
  - 1
