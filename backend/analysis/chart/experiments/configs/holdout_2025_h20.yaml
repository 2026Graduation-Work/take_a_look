experiment_name: holdout_2025_h20_u375_d300
description: 'Final H20 chart baseline: train 2022-2024, untouched 2025 holdout.'
tags:
- baseline
- final_holdout
- dynamic_sigma
- h20
data:
  tickers: ''
  universe: kospi_all_2024-12-30_snapshot
  universe_file: experiments/configs/universes/kospi_all_2024-12-30.csv
  start_date: '2022-01-01'
  end_date: '2025-12-31'
  split_strategy: single
  embargo_days: 7
  splits:
  - fold_id: 0
    name: 2025 final holdout
    train_start: '2022-01-01'
    train_end: '2024-12-31'
    test_start: '2025-01-08'
    test_end: '2025-12-31'
features:
  groups:
  - base
  include: []
  exclude: []
labels:
  type: dynamic_sigma
  volatility_mode: current_sigma
  horizon: 20
  up_mult: 3.75
  down_mult: 3.0
  up_class: 2
  neutral_class: 1
  down_class: 0
model:
  type: LGBM
  objective: multiclass
  params:
    n_estimators: 1000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 20
    min_child_samples: 2000
    colsample_bytree: 0.7
    subsample: 0.8
    subsample_freq: 1
    class_weight: balanced
    random_state: 42
    n_jobs: -1
training:
  skip_validation: true
strategy:
  score_column: prob_up
  selection: top_k
  top_n: 5
  prob_threshold: 0.65
  position_weighting: equal_weight
backtest:
  initial_cash: 10000000
  signal_lag_days: 1
  entry_price: open
  exit_price: rule
  fee: 0.00105
  max_holding_days: 20
  up_mult: 3.75
  down_mult: 3.0
  hard_sl_mult: 2.0
evaluation:
  probability_bins:
  - 0
  - 0.2
  - 0.4
  - 0.6
  - 0.8
  - 1
  benchmark_file: data/datasets/local_2016_v1/benchmarks/KOSPI.parquet
  benchmark_strategies:
  - market_index
contract_version: 3
dataset: configs/dataset.yaml
