name: Web CI

# 프론트엔드(frontend) 변경 시 lint + build + 데모 E2E 자동 실행.
# PR에서는 항상 시작하고 job 안에서 경로를 본다 — main 규칙의 필수 체크(lint-and-build)가
# 프론트 변경이 없는 PR에서도 "건너뜀(통과)"으로 보고되게(경로 필터로 아예 안 돌면 영원히 대기).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web-ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/web-ci.yml'

  lint-and-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # e2e 계정 흐름용 가짜 Supabase 주소. NEXT_PUBLIC_*은 빌드 때 박히므로 job 전체에 둔다.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # 버전은 frontend/package.json 의 packageManager 필드에서 읽는다.
        # (action은 working-directory 기본값을 따르지 않아 경로를 명시한다.)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true # 러너 캐시(22.23.3)가 아니라 최신 보안 패치를 받는다(10/21 Node 보안 릴리스)
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Unit tests (node --test)
        run: pnpm test:unit

      - name: Cache OCR assets
        # prebuild가 받는 글자 읽기 도구(약 55MB). 스크립트(주소, 해시)가 바뀌면 키가 바뀐다
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/public/ocr
          key: ocr-assets-${{ hashFiles('frontend/scripts/fetch-ocr-assets.mjs') }}

      - name: Build (next build)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Demo onboarding E2E
        run: pnpm test:e2e
