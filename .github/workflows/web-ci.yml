name: Web CI

# 프론트엔드(frontend) 변경 시 lint + build + 데모 E2E 자동 실행.
# Python CI(python-ci.yml)와 경로 필터로 분리되어 상호 간섭하지 않는다.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # e2e 계정 흐름용 가짜 Supabase 주소. NEXT_PUBLIC_*은 빌드 때 박히므로 job 전체에 둔다.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # 버전은 frontend/package.json 의 packageManager 필드에서 읽는다.
        # (action은 working-directory 기본값을 따르지 않아 경로를 명시한다.)
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Build (next build)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Demo onboarding E2E
        run: pnpm test:e2e
