name: KRX managed stock alternative verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chart-serving-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    defaults:
      run:
        working-directory: backend/analysis/chart
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 93c1ab0f6eb11f6d23ccbd01d9a067b6fe0ea15f
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing serving dependencies
        run: python -m pip install -q -r serving/requirements.txt
      - name: Verify official stock codes and exercise stock master with an in-memory database
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PYTHON'
          import contextlib
          import hashlib
          import io
          import json
          import re
          import sys
          from datetime import date
          from unittest.mock import patch
          
          import numpy as np
          import pandas as pd
          from shared.data.krx import authenticated_stock
          from shared.data.providers import get_krx_session
          from serving import stock_master
          
          EXPECTED_STOCK_CODE_HASH = '6cea077a23841f74caa1d2250244526ac3e6a033573941b2c2f7da346dd73457'
          
          # KRX official page 20012, using the application's existing login session.
          authenticated_stock()
          session = get_krx_session()
          if session is None or not session.is_valid():
              raise RuntimeError('KRX authentication unavailable')
          response = session.post('https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd',
              data={'bld': 'dbms/MDC/STAT/issue/MDCSTAT21401', 'locale': 'ko_KR',
                    'mktId': 'ALL', 'share': '1', 'money': '1', 'csvxls_isNo': 'false'}, timeout=(10, 30))
          response.raise_for_status()
          rows = response.json().get('output')
          if not isinstance(rows, list) or not rows:
              raise RuntimeError('KRX managed list missing')
          if any(not isinstance(row.get('ISU_CD'), str) or not re.fullmatch(r'[0-9A-Z]{6}', row['ISU_CD'])
                 or not isinstance(row.get('ISU_NM'), str) or not row['ISU_NM'].strip() for row in rows):
              raise RuntimeError('Invalid managed stock code or name')
          codes = {row['ISU_CD'] for row in rows}
          names = {row['ISU_NM'].strip() for row in rows}
          if len(codes) != len(rows) or len(names) != len(rows):
              raise RuntimeError('Duplicate managed stock identifier')
          code_hash = hashlib.sha256('\n'.join(sorted(codes)).encode()).hexdigest()
          if code_hash != EXPECTED_STOCK_CODE_HASH:
              raise RuntimeError('KRX stock codes differ from the current public KIND download')
          
          listing_response = session.post('https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd',
              data={'bld': 'dbms/MDC/STAT/standard/MDCSTAT01901', 'mktId': 'ALL',
                    'share': '1', 'csvxls_isNo': 'false'}, timeout=(10, 30))
          listing_response.raise_for_status()
          listing = {row['ISU_SRT_CD']: row for row in listing_response.json()['OutBlock_1']}
          assert '373790' not in listing, 'The KIND-only ETF unexpectedly appears in the stock listing'
          assert codes <= set(listing), 'Managed stock absent from current stock metadata'
          assert all(listing[row['ISU_CD']]['ISU_ABBRV'] == row['ISU_NM'].strip() for row in rows)
          assert listing['473000']['ISU_ABBRV'] == '에스케이증권제12호스팩'
          print(json.dumps({'event': 'krx_route_verified', 'http_status': response.status_code,
              'managed_stocks': len(codes), 'kind_stock_code_hash_equal': True,
              'official_listing_names_equal': True, 'excluded_kind_etfs': 1,
              'all_stock_codes_sha256': code_hash}, ensure_ascii=False))
          
          # Exercise the existing command in memory, using the fetched names. No DB credentials or network calls.
          managed_name = rows[0]['ISU_NM'].strip()
          control_name = '검증용일반종목'
          assert control_name not in names
          as_of = date.today().isoformat()
          universe = pd.DataFrame({'Code': ['000010', '000020'], 'Name': [managed_name, control_name]})
          dates = pd.bdate_range(end=as_of, periods=100)
          closes = 10000 * np.exp(np.arange(100) * 0.001 + np.sin(np.arange(100)) * 0.002)
          frame = pd.DataFrame({'Date': dates, 'Close': closes, 'Amount': 1e8})
          
          
          class MemoryStore:
              def __init__(self):
                  self.writes = []
          
              def _request(self, method, path, body=None, **kwargs):
                  if method == 'GET' and path.startswith('/rest/v1/chart_universe?'):
                      return [{'as_of': as_of}]
                  if method == 'POST' and path == '/rest/v1/stocks?on_conflict=code':
                      self.writes.extend(body)
                      return None
                  raise AssertionError('Unexpected mocked database operation')
          
              def load_universe(self, requested):
                  assert requested == as_of
                  return universe
          
              def load_price_panel(self, start, end):
                  assert end == as_of
                  return {'000010': frame.copy(), '000020': frame.copy()}
          
          
          for dry_run in (True, False):
              store = MemoryStore()
              output = io.StringIO()
              arguments = ['stock_master', '--dry-run'] if dry_run else ['stock_master']
              with patch.object(stock_master, 'SupabaseStore', return_value=store), patch.object(
                  stock_master, 'fetch_managed_names', return_value=names
              ), patch.object(stock_master, 'fetch_large_caps', return_value=frozenset()), patch.object(
                  sys, 'argv', arguments
              ), contextlib.redirect_stdout(output):
                  stock_master.main()
              results = json.loads(output.getvalue().splitlines()[-1]) if dry_run else store.writes
              assert len(results) == 2
              assert 'managed_stock' in results[0]['risk_flags'] and results[0]['risk_grade'] == 1
              assert 'managed_stock' not in results[1]['risk_flags']
              assert bool(store.writes) is not dry_run
          print(json.dumps({'event': 'mock_cli_verified', 'modes': ['dry-run', 'normal'],
              'managed_flag': True, 'managed_risk_grade': 1, 'control_not_managed': True,
              'real_database_access': False}))
          PYTHON
