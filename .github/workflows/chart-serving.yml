name: Daily chart serving

on:
  schedule:
    # GitHub cron uses UTC: weekdays 18:30 Asia/Seoul.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Confirmed KRX date (YYYY-MM-DD); leave empty for latest"
        required: false
        type: string

permissions:
  contents: read

# A manual replay and the scheduled run must never publish concurrently.
concurrency:
  group: chart-serving-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend/analysis/chart
    env:
      CHART_SERVING_DATA_DIR: ${{ github.workspace }}/backend/analysis/chart/workspace/serving
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/analysis/chart/shared/requirements.txt
            backend/analysis/chart/serving/requirements.txt

      - name: Install serving dependencies
        run: python -m pip install -r serving/requirements.txt

      - name: Check publishing secrets
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "SUPABASE_SECRET_KEY secret is missing"; exit 1; }
          test -n "$KRX_ID" || { echo "KRX_ID secret is missing"; exit 1; }
          test -n "$KRX_PW" || { echo "KRX_PW secret is missing"; exit 1; }

      - name: Download and verify configured model pack
        run: |
          for attempt in 1 2 3; do
            if python -m serving.pack download --config serving/config.yaml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Collect, infer, and publish
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          args=(--publish)
          if [ -n "$REQUESTED_AS_OF" ]; then
            args+=(--as-of "$REQUESTED_AS_OF")
          fi
          python -m serving.run_daily "${args[@]}"
