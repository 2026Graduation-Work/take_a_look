name: KIND stock master diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: One stock master KIND request without credentials or database access
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import platform
          import re
          import socket
          import ssl
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          url = 'https://kind.krx.co.kr/investwarn/adminissue.do'
          body = urlencode({'method': 'searchAdminIssueSub', 'currentPageSize': 3000, 'pageIndex': 1,
                            'orderMode': 1, 'orderStat': 'D', 'marketType': '', 'forward': 'adminissue_sub'})
          request = Request(url, data=body.encode(), headers={'User-Agent': 'Mozilla/5.0'})
          result = {'at': datetime.now(timezone.utc).isoformat(), 'python': platform.python_version(),
                    'tls': ssl.OPENSSL_VERSION, 'method': request.get_method(), 'url': url,
                    'request_headers': dict(request.header_items()), 'body': body,
                    'dns': sorted({x[4][0] for x in socket.getaddrinfo('kind.krx.co.kr', 443)})}
          try:
              response = urlopen(request, timeout=30)
          except HTTPError as error:
              response = error
          except (URLError, TimeoutError) as error:
              result['network_error'] = str(error)
              print(json.dumps(result, ensure_ascii=False))
              raise SystemExit(1)
          with response:
              page = response.read()
              result.update(status=response.code, final_url=response.url,
                            response_headers={key: value for key, value in response.headers.items()
                                              if key.lower() not in {'set-cookie'}},
                            bytes=len(page), sha256=hashlib.sha256(page).hexdigest())
              text = page.decode('utf-8', errors='replace')
              result['managed_cells'] = len(re.findall(r'<td class="first">(.*?)</td>', text, re.S))
              if response.code >= 400 or result['managed_cells'] == 0:
                  result['error_text'] = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', text))[:2000]
          print(json.dumps(result, ensure_ascii=False))
          PYTHON
