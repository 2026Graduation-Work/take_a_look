name: KRX managed stock alternative verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chart-serving-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    defaults:
      run:
        working-directory: backend/analysis/chart
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 93c1ab0f6eb11f6d23ccbd01d9a067b6fe0ea15f
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install existing serving dependencies
        run: python -m pip install -q -r serving/requirements.txt
      - name: Verify authenticated KRX management list and compare source coverage
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PYTHON'
          import contextlib
          import hashlib
          import html
          import io
          import json
          import re
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          
          
          def digest(values):
              return hashlib.sha256('\n'.join(sorted(values)).encode()).hexdigest()
          
          
          # Reuse the application's authentication entry point. Never print login output.
          from shared.data.krx import authenticated_stock
          from shared.data.providers import get_krx_session
          
          authenticated_stock()
          session = get_krx_session()
          if session is None or not session.is_valid():
              raise RuntimeError('KRX authentication unavailable')
          
          request_data = {'bld': 'dbms/MDC/STAT/issue/MDCSTAT21401', 'locale': 'ko_KR',
                          'mktId': 'ALL', 'share': '1', 'money': '1', 'csvxls_isNo': 'false'}
          response = session.post('https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd',
                                  data=request_data, timeout=(10, 30))
          response.raise_for_status()
          payload = response.json()
          rows = payload.get('output')
          if not isinstance(rows, list) or not rows:
              print(json.dumps({'event': 'krx_managed_invalid', 'keys': sorted(payload)}, ensure_ascii=False))
              raise RuntimeError('KRX managed rows missing')
          fields = sorted(rows[0])
          if any(not isinstance(row.get('ISU_NM'), str) or not row['ISU_NM'].strip() for row in rows):
              raise RuntimeError('Invalid managed stock name')
          names = {row['ISU_NM'].strip() for row in rows}
          print(json.dumps({'event': 'krx_managed', 'at': datetime.now(timezone.utc).isoformat(),
                            'status': response.status_code, 'rows': len(rows), 'names': len(names),
                            'fields': fields, 'name_sha256': digest(names)}, ensure_ascii=False))
          
          # Read the current listing to compare the service's KOSPI plus 247540 coverage.
          time.sleep(1)
          listing_response = session.post('https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd',
              data={'bld': 'dbms/MDC/STAT/standard/MDCSTAT01901', 'mktId': 'ALL',
                    'share': '1', 'csvxls_isNo': 'false'}, timeout=(10, 30))
          listing_response.raise_for_status()
          listing = listing_response.json()['OutBlock_1']
          service_names = {row['ISU_ABBRV'] for row in listing
                           if row['MKT_TP_NM'] in {'KOSPI', 'KOSDAQ', 'KOSDAQ GLOBAL'}}
          market_by_name = {row['ISU_ABBRV']: row['MKT_TP_NM'] for row in listing}
          if len(service_names) < 500:
              raise RuntimeError('Listing scope invalid')
          
          body = urlencode({'method': 'searchAdminIssueSub', 'currentPageSize': 3000, 'pageIndex': 1,
                            'orderMode': 1, 'orderStat': 'D', 'marketType': '', 'forward': 'adminissue_sub'})
          try:
              with urlopen(Request('https://kind.krx.co.kr/investwarn/adminissue.do', data=body.encode(),
                                   headers={'User-Agent': 'Mozilla/5.0'}), timeout=30) as result:
                  page = result.read().decode('utf-8')
              cells = re.findall(r'<td class="first">(.*?)</td>', page, re.S)
              kind_names = {html.unescape(re.sub(r'<[^>]+>', ' ', cell)).strip() for cell in cells} - {''}
              if not kind_names:
                  raise RuntimeError('KIND list empty')
              print(json.dumps({'event': 'source_comparison', 'kind_status': 200, 'kind_names': len(kind_names),
                  'krx_names': len(names), 'global_equal': names == kind_names,
                  'global_krx_only': len(names-kind_names), 'global_kind_only': len(kind_names-names),
                  'difference_markets': {name: market_by_name.get(name, 'not in current listing') for name in sorted(names ^ kind_names)},
                  'scope': 'current KOSPI and KOSDAQ listings', 'service_names': len(service_names), 'krx_service_managed': len(names & service_names),
                  'kind_service_managed': len(kind_names & service_names),
                  'service_equal': (names & service_names) == (kind_names & service_names),
                  'service_difference_count': len((names ^ kind_names) & service_names)}, ensure_ascii=False))
              if (names & service_names) != (kind_names & service_names):
                  raise RuntimeError('Sources disagree in service scope')
          except HTTPError as error:
              text = html.unescape(error.read(3000).decode('utf-8', errors='replace'))
              reference = re.search(r'Reference\s*#([^<\s]+)', text)
              print(json.dumps({'event': 'source_comparison', 'kind_status': error.code,
                  'kind_reference': reference.group(1) if reference else None,
                  'krx_service_managed': len(names & service_names)}, ensure_ascii=False))
              if error.code != 403:
                  raise
          PYTHON
