name: Python CI

# Python 영역(backend/profiling / backend/analysis/chart / backend/analysis/text / schema) 변경 시 블록별 lint + test.
# dorny/paths-filter로 변경된 블록만 해당 job을 실행한다.
# schema/** 변경은 블록 간 계약이므로 3개 job 모두 트리거.

on:
  push:
    branches: [main]
    paths:
      - "backend/profiling/**"
      - "frontend/lib/profiling/style-questions.json"
      - "backend/analysis/**"
      - "schema/**"
      - "ruff.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  # ── 경로 감지 ──────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-24.04
    outputs:
      profiling: ${{ steps.filter.outputs.profiling }}
      chart: ${{ steps.filter.outputs.chart }}
      text: ${{ steps.filter.outputs.text }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            profiling:
              - 'backend/profiling/**'
              - 'frontend/lib/profiling/style-questions.json' # 8축 문항 정의(계약 검사 대상)
              - 'schema/**'
              - 'ruff.toml'
              - '.github/workflows/python-ci.yml'
            chart:
              - 'backend/analysis/chart/**'
              - 'schema/**'
              - 'ruff.toml'
              - '.github/workflows/python-ci.yml'
            text:
              - 'backend/analysis/text/**'
              - 'schema/**'
              - 'ruff.toml'
              - '.github/workflows/python-ci.yml'

  # ── profiling 블록 ─────────────────────────────────────────────────────────
  profiling-test:
    needs: changes
    if: ${{ needs.changes.outputs.profiling == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/profiling/survey
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/profiling/survey/requirements.txt
            backend/profiling/survey/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: .
        run: ruff check backend/profiling/

      - name: Run tests (pytest)
        run: pytest . -v

  # ── backend/analysis/chart 블록 ────────────────────────────────────────────────────
  chart-test:
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [experiments, serving]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/analysis/chart/shared/requirements.txt
            backend/analysis/chart/${{ matrix.environment }}/requirements.txt

      - name: Install selected environment
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r backend/analysis/chart/${{ matrix.environment }}/requirements.txt

      - name: Lint active chart code
        run: ruff check backend/analysis/chart/

      - name: Test research pipeline and export
        if: matrix.environment == 'experiments'
        run: python -m pytest backend/analysis/chart/ -v

      - name: Test serving without experiments code or dependencies
        if: matrix.environment == 'serving'
        working-directory: backend/analysis/chart
        run: |
          chart_serving_root="$RUNNER_TEMP/chart-serving"
          mkdir -p "$chart_serving_root"
          cp -R shared serving conftest.py "$chart_serving_root/"
          cd "$chart_serving_root"
          python -m pytest shared/tests serving/tests -v
          python -m serving.run_daily --help

  # ── backend/analysis/text 블록 ─────────────────────────────────────────────────────
  text-test:
    needs: changes
    if: ${{ needs.changes.outputs.text == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/analysis/text/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # torch를 먼저 CPU-only 빌드로 고정 설치한다. requirements.txt의
          # torch>=2.0.0 보다 앞서야 CUDA 빌드(수 GB)를 받지 않는다.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # 블록 전체 의존성 (preprocess + value_pipeline)
          pip install -r backend/analysis/text/requirements.txt

      - name: Lint (ruff)
        run: ruff check backend/analysis/text/

      - name: Run tests (pytest)
        run: |
          if find backend/analysis/text -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest backend/analysis/text/ -v
          else
            echo "No test files in backend/analysis/text — lint-only pass."
          fi
